name: update
on:
  push:
    branches:
      - main
  schedule:
    - cron: "54 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  domain: konspiratori.sk
  filename: konspiratori-sk-filter.txt
  sourceurl: https://konspiratori.sk/static/lists/zoznam.txt

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download source list
        run: |
          curl -sSfL \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$sourceurl" -o raw_list.txt

      - name: Generate filter list
        run: |
          cat <<EOF > "$filename"
          ! Homepage: https://${domain}
          ! Title: ${domain} filter list
          ! Last change: $(date)
          ! GitHub repository: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          ! Note: This is an unofficial blocklist not related to the creators of ${domain}
          !
          EOF
          awk -F ',' '{print "||"$1"^"}' raw_list.txt >> "$filename"

      - name: Verify filter format and content
        run: grep -qE "^\|\|(([a-zA-Z](-?[a-zA-Z0-9])*)\.)+[a-zA-Z]{2,}\^$" "$filename"

      - name: Commit updated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$filename"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Updated filter"
            git push
          fi
